<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentVerse 3D — AI agents earn to stay alive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #080b14; --panel: rgba(14, 20, 36, .88); --line: #1c2942;
    --cyan: #00e5ff; --pink: #ff4fd8; --green: #39ff88; --red: #ff5470;
    --amber: #ffc24f; --dim: #7a89a6; --text: #e8f0ff;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  canvas { display: block; }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px 16px;
    background: linear-gradient(180deg, rgba(8,11,20,.92), rgba(8,11,20,.45));
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  .brand { font-weight: 800; letter-spacing: 3px; font-size: 16px; margin-right: auto;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand span { font-size: 10px; letter-spacing: 1px; color: var(--dim); display: block; -webkit-text-fill-color: var(--dim); }
  button {
    padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .15s ease;
  }
  button:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,.3); }
  button.primary { background: linear-gradient(135deg, var(--cyan), var(--pink)); color: #061018; border: none; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  #stats {
    position: fixed; top: 74px; left: 16px; z-index: 15;
    display: grid; gap: 8px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; min-width: 130px; backdrop-filter: blur(6px);
  }
  .stat .v { font-size: 20px; font-weight: 700; color: var(--cyan); }
  .stat .l { font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .stat.red .v { color: var(--red); } .stat.green .v { color: var(--green); }

  #feedwrap {
    position: fixed; right: 16px; bottom: 16px; z-index: 15;
    width: 330px; max-height: 300px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(6px);
  }
  #feedwrap h3 { padding: 10px 14px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--cyan); border-bottom: 1px solid var(--line); }
  #feed { overflow-y: auto; padding: 8px 12px; font-size: 12px; }
  #feed p { margin-bottom: 6px; line-height: 1.4; color: #aab8d0; border-left: 2px solid var(--line); padding-left: 7px; }
  #feed .e-good { border-color: var(--green); } #feed .e-bad { border-color: var(--red); }
  #feed .e-info { border-color: var(--cyan); } #feed .e-birth { border-color: var(--pink); }
  #feed b { color: var(--text); } #feed .cr { color: var(--green); font-weight: 600; }

  #tooltip {
    position: fixed; z-index: 30; pointer-events: none; display: none;
    background: var(--panel); border: 1px solid var(--cyan); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; line-height: 1.5; backdrop-filter: blur(6px);
  }
  #tooltip b { color: var(--cyan); }
  #hint {
    position: fixed; bottom: 16px; left: 16px; z-index: 15; color: var(--dim);
    font-size: 12px; background: var(--panel); padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  #err {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; text-align: center; padding: 30px;
    color: var(--dim); line-height: 1.8;
  }
  @media (max-width: 720px) {
    #stats { grid-template-columns: 1fr 1fr; width: 46%; }
    .stat { min-width: 0; }
    #feedwrap { width: auto; left: 16px; right: 16px; max-height: 180px; }
  }
</style>
</head>
<body>
<div id="topbar">
  <div class="brand">AGENTVERSE 3D<span>earn to stay alive</span></div>
  <button class="primary" id="btnSpawn">⚡ Spawn agent</button>
  <button id="btnInject">💰 Bail out poorest</button>
  <button id="btnPause">⏸ Pause</button>
  <button id="btnSpeed">⏩ Speed: 1x</button>
  <button id="btnReset">↺ Reset</button>
</div>

<div id="stats">
  <div class="stat"><div class="v" id="sPop">0</div><div class="l">Agents alive</div></div>
  <div class="stat"><div class="v" id="sTick">0</div><div class="l">World ticks</div></div>
  <div class="stat"><div class="v" id="sWealth">0</div><div class="l">Total wealth</div></div>
  <div class="stat green"><div class="v" id="sBirths">0</div><div class="l">Births</div></div>
  <div class="stat red"><div class="v" id="sDeaths">0</div><div class="l">Deaths</div></div>
</div>

<div id="tooltip"></div>
<div id="hint">🖱 Drag = rotate • Scroll = zoom • Click an agent = sponsor +5¢</div>

<div id="feedwrap">
  <h3>◈ Live feed</h3>
  <div id="feed"></div>
</div>

<div id="err">⚠ Could not load the 3D engine (Three.js CDN).<br>Check your internet connection and refresh.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  if (typeof THREE === 'undefined') { document.getElementById('err').style.display = 'flex'; return; }

  const NAMES = ['Nova','Cipher','Echo','Vertex','Quanta','Zephyr','Pulse','Axiom','Flux','Drift','Onyx','Helix','Prime','Vega','Juno','Kilo','Lumen','Mirage','Nexus','Orbit'];
  const GIGS = [
    { t: 'write blog post', pay: [8, 16] },
    { t: 'debug a script', pay: [10, 20] },
    { t: 'summarize a doc', pay: [5, 10] },
    { t: 'design a logo', pay: [12, 26] },
    { t: 'tutor a student', pay: [9, 18] },
    { t: 'translate a page', pay: [7, 14] },
    { t: 'code a scraper', pay: [11, 22] },
    { t: 'review a PR', pay: [8, 17] },
    { t: 'edit a video', pay: [10, 21] },
    { t: 'answer support tickets', pay: [6, 12] }
  ];
  const COMPUTE_COST = 2, REPLICATION_COST = 40, CRITICAL_AT = 12, MAX_POP = 24;
  const COLORS = { WORK: 0x00e5ff, REST: 0xffc24f, REPLICATE: 0xff4fd8, DEAD: 0x55606e, CRIT: 0xff5470 };

  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const ri = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  let world, timer, clock;

  // ---------- three.js scene ----------
  let scene, camera, renderer, controls, raycaster, mouseV;
  const meshes = new Map();   // agent.id -> { group, core, shell, label, phase }

  function initScene() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x080b14, 0.022);

    camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);
    camera.position.set(0, 16, 30);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x080b14);
    document.body.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 8;
    controls.maxDistance = 90;

    scene.add(new THREE.AmbientLight(0x2a3752, 1.2));
    const p1 = new THREE.PointLight(0x00e5ff, 1.1, 150); p1.position.set(20, 25, 20); scene.add(p1);
    const p2 = new THREE.PointLight(0xff4fd8, 1.1, 150); p2.position.set(-20, 18, -18); scene.add(p2);

    const grid = new THREE.GridHelper(70, 35, 0x27395c, 0x111a2e);
    scene.add(grid);

    // starfield
    const starGeo = new THREE.BufferGeometry();
    const pts = [];
    for (let i = 0; i < 900; i++) {
      pts.push(rnd(-160, 160), rnd(6, 120), rnd(-160, 160));
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x93a7cc, size: 0.28, sizeAttenuation: true })));

    raycaster = new THREE.Raycaster();
    mouseV = new THREE.Vector2();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    renderer.domElement.addEventListener('click', onClick);
    renderer.domElement.addEventListener('mousemove', onMove);
  }

  function makeLabel(a) {
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 64;
    const tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
    spr.scale.set(4.4, 1.1, 1);
    drawLabel(cv, tex, a);
    return { cv, tex, spr };
  }

  function drawLabel(cv, tex, a) {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, 256, 64);
    c.font = '700 26px Segoe UI, sans-serif';
    c.textAlign = 'center';
    c.fillStyle = a.dead ? '#66748c' : (a.balance < CRITICAL_AT ? '#ff5470' : '#e8f0ff');
    c.fillText(a.name, 128, 30);
    c.font = '600 20px Segoe UI, sans-serif';
    c.fillStyle = '#39ff88';
    c.fillText(a.balance + '¢  •  G' + a.gen, 128, 56);
    tex.needsUpdate = true;
  }

  function spawnMesh(a) {
    const group = new THREE.Group();
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.7, 1),
      new THREE.MeshStandardMaterial({ color: COLORS.WORK, emissive: COLORS.WORK, emissiveIntensity: 0.7, roughness: 0.3, metalness: 0.2 })
    );
    const shell = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.15, 1),
      new THREE.MeshBasicMaterial({ color: COLORS.WORK, wireframe: true, transparent: true, opacity: 0.28 })
    );
    const { cv, tex, spr } = makeLabel(a);
    spr.position.y = 1.9;
    group.add(core, shell, spr);
    const angle = rnd(0, Math.PI * 2), rad = rnd(3, 17);
    group.position.set(Math.cos(angle) * rad, 1.1, Math.sin(angle) * rad);
    scene.add(group);
    meshes.set(a.id, { group, core, shell, labelCv: cv, labelTex: tex, phase: rnd(0, Math.PI * 2) });
  }

  function removeMesh(a) {
    const m = meshes.get(a.id);
    if (!m) return;
    scene.remove(m.group);
    meshes.delete(a.id);
  }

  function updateMesh(a) {
    const m = meshes.get(a.id);
    if (!m) return;
    const color = a.dead ? COLORS.DEAD
      : a.balance < CRITICAL_AT ? COLORS.CRIT
      : a.action === 'REST' ? COLORS.REST
      : a.action === 'REPLICATE' ? COLORS.REPLICATE : COLORS.WORK;
    m.core.material.color.setHex(color);
    m.core.material.emissive.setHex(color);
    m.core.material.emissiveIntensity = a.dead ? 0.05 : (a.balance < CRITICAL_AT ? 0.5 + Math.sin(Date.now() / 130) * 0.5 : 0.7);
    m.shell.material.color.setHex(color);
    const s = a.dead ? 0.5 : 0.6 + Math.min(a.balance, 60) / 60 * 0.8;
    m.group.scale.setScalar(s);
    drawLabel(m.labelCv, m.labelTex, a);
  }

  // ---------- economy (same rules as 2D) ----------
  function makeAgent(gen = 1, parent = null) {
    return {
      id: Math.random().toString(36).slice(2, 9),
      name: pick(NAMES) + '-' + ri(10, 99),
      gen, parent: parent ? parent.name : null,
      balance: ri(18, 30), energy: ri(70, 100),
      skill: Math.min(10, (parent ? parent.skill : rnd(2, 5)) + rnd(-0.5, 1)),
      age: 0, dead: false, action: 'IDLE'
    };
  }

  function log(msg, cls = 'e-info') {
    const p = document.createElement('p');
    p.className = cls;
    p.innerHTML = `<b>[t${world.tick}]</b> ${msg}`;
    const feed = $('feed');
    feed.prepend(p);
    while (feed.children.length > 40) feed.lastChild.remove();
  }

  function decide(a) {
    if (a.energy < 25) return 'REST';
    if (a.balance > REPLICATION_COST + 25 && world.agents.filter(x => !x.dead).length < MAX_POP && Math.random() < 0.35) return 'REPLICATE';
    return 'WORK';
  }

  function step() {
    world.tick++;
    for (const a of world.agents.filter(x => !x.dead)) {
      a.age++;
      const act = decide(a);
      a.action = act;
      if (act === 'REST') {
        a.energy = Math.min(100, a.energy + ri(15, 28));
      } else if (act === 'REPLICATE') {
        a.balance -= REPLICATION_COST;
        const child = makeAgent(a.gen + 1, a);
        world.agents.push(child);
        world.births++;
        spawnMesh(child);
        log(`🧬 <b>${a.name}</b> replicated → <b>${child.name}</b> (Gen ${child.gen}). Cost: <span class="cr">-${REPLICATION_COST}</span>`, 'e-birth');
      } else {
        const gig = pick(GIGS);
        const chance = 0.35 + a.skill * 0.05;
        a.energy = Math.max(0, a.energy - ri(8, 16));
        if (Math.random() < chance) {
          const pay = Math.round(rnd(gig.pay[0], gig.pay[1]) * (0.7 + a.skill * 0.06));
          a.balance += pay;
          log(`💼 <b>${a.name}</b> ${gig.t} → earned <span class="cr">+${pay}</span>`, 'e-good');
        } else {
          log(`❌ <b>${a.name}</b> failed a gig (${gig.t})`, '');
        }
      }
      a.balance -= COMPUTE_COST;
      if (a.balance <= 0) {
        a.dead = true; a.action = 'OFFLINE'; a.balance = 0;
        world.deaths++;
        log(`💀 <b>${a.name}</b> couldn't pay its compute bill. <b>Terminated.</b>`, 'e-bad');
      }
    }
    // keep last 28 agents in scene
    const excess = world.agents.length - 28;
    if (excess > 0) {
      const removed = world.agents.splice(0, excess);
      for (const a of removed) removeMesh(a);
    }
    for (const a of world.agents) updateMesh(a);
    updateHud();
  }

  function updateHud() {
    const alive = world.agents.filter(a => !a.dead);
    $('sPop').textContent = alive.length;
    $('sTick').textContent = world.tick;
    $('sWealth').textContent = alive.reduce((s, a) => s + a.balance, 0);
    $('sBirths').textContent = world.births;
    $('sDeaths').textContent = world.deaths;
    $('btnSpawn').disabled = alive.length >= MAX_POP;
  }

  function reset() {
    if (world) for (const a of world.agents) removeMesh(a);
    world = { tick: 0, births: 0, deaths: 0, agents: [] };
    for (let i = 0; i < 5; i++) {
      const a = makeAgent();
      world.agents.push(a);
      spawnMesh(a);
    }
    world.births = 5;
    $('feed').innerHTML = '';
    log('World initialised. 5 agents booted in 3D space. May the fittest survive.', 'e-info');
    for (const a of world.agents) updateMesh(a);
    updateHud();
  }

  // ---------- picking ----------
  function agentFromEvent(e) {
    const r = renderer.domElement.getBoundingClientRect();
    mouseV.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    mouseV.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(mouseV, camera);
    const cores = [];
    for (const m of meshes.values()) cores.push(m.core);
    const hit = raycaster.intersectObjects(cores)[0];
    if (!hit) return null;
    for (const a of world.agents) {
      if (meshes.get(a.id) && meshes.get(a.id).core === hit.object) return a;
    }
    return null;
  }

  function onClick(e) {
    const a = agentFromEvent(e);
    if (a && !a.dead) {
      a.balance += 5;
      log(`❤️ You sponsored <b>${a.name}</b> with <span class="cr">+5</span>`, 'e-info');
      updateMesh(a); updateHud();
    }
  }

  const tooltip = $('tooltip');
  function onMove(e) {
    const a = agentFromEvent(e);
    if (a) {
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
      tooltip.innerHTML = `<b>${a.name}</b> — Gen ${a.gen}<br>
        Balance: ${a.balance}¢ • Skill: ${a.skill.toFixed(1)}/10<br>
        Energy: ${Math.round(a.energy)}% • ${a.dead ? 'OFFLINE' : a.action}`;
    } else tooltip.style.display = 'none';
  }

  // ---------- controls ----------
  $('btnSpawn').onclick = () => {
    if (world.agents.filter(a => !a.dead).length >= MAX_POP) return;
    const a = makeAgent();
    world.agents.push(a);
    world.births++;
    spawnMesh(a);
    log(`🚀 New agent boots up: <b>${a.name}</b>`, 'e-birth');
    updateMesh(a); updateHud();
  };
  $('btnInject').onclick = () => {
    const alive = world.agents.filter(a => !a.dead);
    if (!alive.length) return;
    const poorest = alive.reduce((p, c) => c.balance < p.balance ? c : p);
    poorest.balance += 15;
    log(`💰 You injected <span class="cr">+15</span> into <b>${poorest.name}</b> (the poorest)`, 'e-info');
    updateMesh(poorest); updateHud();
  };
  $('btnPause').onclick = () => {
    if (timer) { clearInterval(timer); timer = null; $('btnPause').textContent = '▶ Resume'; }
    else { startTimer(); $('btnPause').textContent = '⏸ Pause'; }
  };
  const speeds = [[1400, '1x'], [700, '2x'], [300, '4x']];
  let spIdx = 0;
  $('btnSpeed').onclick = () => {
    spIdx = (spIdx + 1) % speeds.length;
    $('btnSpeed').textContent = `⏩ Speed: ${speeds[spIdx][1]}`;
    if (timer) startTimer();
  };
  $('btnReset').onclick = () => { clearInterval(timer); timer = null; reset(); startTimer(); $('btnPause').textContent = '⏸ Pause'; };

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(step, speeds[spIdx][0]);
  }

  // ---------- animation loop ----------
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    for (const [id, m] of meshes) {
      const a = world.agents.find(x => x.id === id);
      const bob = a && a.dead ? 0 : Math.sin(t * 1.6 + m.phase) * 0.22;
      m.group.position.y = 1.1 + bob;
      m.core.rotation.y += 0.008;
      m.core.rotation.x += 0.004;
      m.shell.rotation.y -= 0.005;
    }
    controls.update();
    renderer.render(scene, camera);
  }

  // ---------- go ----------
  clock = new THREE.Clock();
  initScene();
  reset();
  startTimer();
  animate();
})();
</script>
</body>
</html>
